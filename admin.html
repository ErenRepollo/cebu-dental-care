<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<title>Staff Dashboard | Cebu Dental Care Center</title>
<style>
:root{--bg:#f3f9f9;--surface:#fff;--ink:#0f2d36;--muted:#4d6a72;--brand:#1f8a89;--brand2:#0f5d66;--on:#fff;--soft:#e0f1ef;--line:#cfe4e1;--bad:#c0392b}
@media(prefers-color-scheme:dark){:root{--bg:#0b1d22;--surface:#133038;--ink:#e6f3f2;--muted:#9bbcc0;--brand:#4fc3c0;--brand2:#7fd1ce;--on:#08262a;--soft:#1b3d45;--line:#2a4f58;--bad:#ff8a7a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar{max-width:1100px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:1.15rem;margin:0}
main{max-width:1100px;margin:0 auto;padding:20px}
button,select,input{font:inherit;color:inherit}
.btn{background:var(--brand);color:var(--on);border:0;border-radius:999px;padding:7px 16px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.bad{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.tools select,.tools input{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px}
.tools input{flex:1;min-width:160px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.stat b{display:block;font-size:1.5rem}.stat span{color:var(--muted);font-size:.85rem}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;font-size:.92rem}
th{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.78rem;font-weight:700;background:var(--soft)}
.pill.confirmed{background:var(--brand);color:var(--on)}.pill.pending{background:#fdeccb;color:#7a4b00}
.pill.cancelled{color:var(--muted);border:1px solid var(--line);background:transparent}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.muted{color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
#gate{text-align:center;padding:80px 20px}
</style>
</head>
<body>
<div id="gate">Checking staff access…</div>
<div id="app" hidden>
<header><div class="bar">
  <h1>Cebu Dental Care Center · Staff</h1>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <span class="muted" id="who"></span>
    <button class="btn ghost" id="pw">Change password</button>
    <a class="btn ghost" href="index.html" style="text-decoration:none">Website</a>
    <button class="btn" id="out">Log out</button>
  </div>
</div></header>
<main>
  <div class="stats" id="stats"></div>
  <div class="tools">
    <select id="fs"><option value="">All statuses</option><option value="pending">Pending</option><option value="confirmed">Confirmed</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select>
    <input id="fd" type="date" aria-label="Filter by date">
    <input id="fq" type="search" placeholder="Search name, phone, ref code">
    <button class="btn ghost" id="rf">Refresh</button>
  </div>
  <div class="tw"><table>
    <thead><tr><th>Ref</th><th>Patient</th><th>Service</th><th>Date &amp; time</th><th>Status</th><th>Actions</th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
</main>
</div>
<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
var db=window.supabase.createClient("https://ircukhvpmbvrprqiqauk.supabase.co","sb_publishable_bVZXbJoPjPGoWfCuQM1BSA_9UXNVysf");
var $=function(i){return document.getElementById(i)},all=[];
function toast(m){var t=$("toast");t.textContent=m;t.className="on";setTimeout(function(){t.className=""},2600)}
function el(tag,txt,cls){var e=document.createElement(tag);if(txt!=null)e.textContent=txt;if(cls)e.className=cls;return e}

(async function init(){
  var s=(await db.auth.getSession()).data.session;
  if(!s){location.replace("index.html");return}
  var st=await db.rpc("is_staff");
  if(!st.data){location.replace("index.html");return}
  $("who").textContent=s.user.email;
  $("gate").hidden=true;$("app").hidden=false;
  load();
})();

async function load(){
  var r=await db.from("appointments").select("*").order("appt_date",{ascending:true}).order("appt_time",{ascending:true});
  if(r.error){toast("Could not load: "+r.error.message);return}
  all=r.data||[];render();
}

function render(){
  var fs=$("fs").value,fd=$("fd").value,q=$("fq").value.trim().toLowerCase();
  var cnt={pending:0,confirmed:0,completed:0,cancelled:0};all.forEach(function(a){cnt[a.status]=(cnt[a.status]||0)+1});
  var S=$("stats");S.textContent="";
  [["pending","Pending"],["confirmed","Confirmed"],["completed","Completed"],["cancelled","Cancelled"]].forEach(function(k){
    var d=el("div",null,"stat");d.appendChild(el("b",cnt[k[0]]||0));d.appendChild(el("span",k[1]));S.appendChild(d)});
  var rows=all.filter(function(a){
    if(fs&&a.status!==fs)return false;if(fd&&a.appt_date!==fd)return false;
    if(q&&(a.patient_name+" "+a.phone+" "+a.ref_code).toLowerCase().indexOf(q)<0)return false;return true});
  var tb=$("rows");tb.textContent="";
  if(!rows.length){var tr=el("tr");var td=el("td","No appointments found.","muted");td.colSpan=6;tr.appendChild(td);tb.appendChild(tr);return}
  rows.forEach(function(a){
    var tr=el("tr");
    tr.appendChild(el("td",a.ref_code));
    var p=el("td");p.appendChild(el("b",a.patient_name));p.appendChild(document.createElement("br"));
    p.appendChild(el("span",a.phone,"muted"));if(a.email){p.appendChild(document.createElement("br"));p.appendChild(el("span",a.email,"muted"))}
    if(a.notes){p.appendChild(document.createElement("br"));p.appendChild(el("span","Note: "+a.notes,"muted"))}
    tr.appendChild(p);tr.appendChild(el("td",a.service));
    tr.appendChild(el("td",a.appt_date+" · "+a.appt_time));
    var sd=el("td");sd.appendChild(el("span",a.status,"pill "+a.status));tr.appendChild(sd);
    var ad=el("td"),w=el("div",null,"acts");
    if(a.status==="pending")w.appendChild(btn("Confirm","btn",function(){setStatus(a,"confirmed")}));
    if(a.status==="confirmed"){
      w.appendChild(btn("Complete","btn",function(){setStatus(a,"completed")}));
      if(a.email)w.appendChild(btn("Send receipt","btn ghost",function(b){sendReceipt(a,b)}));
    }
    if(a.status==="pending"||a.status==="confirmed")w.appendChild(btn("Cancel","btn bad",function(){if(confirm("Cancel this appointment?"))setStatus(a,"cancelled")}));
    ad.appendChild(w);tr.appendChild(ad);tb.appendChild(tr);
  });
}
function btn(t,c,f){var b=el("button",t,c);b.onclick=function(){f(b)};return b}

async function setStatus(a,s){
  var r=await db.from("appointments").update({status:s}).eq("id",a.id);
  if(r.error){toast("Update failed: "+r.error.message);return}
  toast("Marked "+s);
  if(s==="confirmed"&&a.email){await sendReceipt(a)}
  load();
}
async function sendReceipt(a,b){
  if(b)b.disabled=true;
  try{
    var ss=(await db.auth.getSession()).data.session;
    var r=await fetch("https://ircukhvpmbvrprqiqauk.supabase.co/functions/v1/send-receipt",{method:"POST",headers:{"Content-Type":"application/json","apikey":"sb_publishable_bVZXbJoPjPGoWfCuQM1BSA_9UXNVysf","Authorization":"Bearer "+ss.access_token},body:JSON.stringify({id:a.id})});
    var j=await r.json().catch(function(){return{}});
    if(!r.ok||j.error)toast("Receipt not sent: "+(j.error||r.status));
    else toast("Receipt with QR sent to "+a.email);
  }catch(e){toast("Receipt not sent: "+e.message)}
  if(b)b.disabled=false;
}

$("out").onclick=async function(){await db.auth.signOut();location.replace("index.html")};
$("rf").onclick=load;
["fs","fd"].forEach(function(i){$(i).onchange=render});$("fq").oninput=render;
$("pw").onclick=async function(){
  var p=prompt("New password (at least 8 characters):");if(!p)return;
  if(p.length<8){toast("Too short");return}
  var r=await db.auth.updateUser({password:p});
  toast(r.error?r.error.message:"Password changed");
};
</script>
</body>
</html>
